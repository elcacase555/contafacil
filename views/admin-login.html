<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ContaFácil - Administrador</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, sans-serif; background: #1C1C1A;
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .caja {
    background: #FFFFFF; border-radius: 12px; padding: 32px 28px; width: 320px;
  }
  .caja h1 { font-size: 18px; margin: 0 0 4px; color: #2C2C2A; }
  .caja p { font-size: 13px; color: #5F5E5A; margin: 0 0 20px; }
  label { font-size: 13px; color: #444441; display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 9px 10px; margin-bottom: 14px;
    border: 1px solid #B4B2A9; border-radius: 6px; font-size: 14px;
  }
  button {
    width: 100%; padding: 10px; background: #2C2C2A; color: white;
    border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #000; }
  #error { color: #A32D2D; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>

  <div class="caja">
    <h1>🔧 Panel de administrador</h1>
    <p>Acceso solo para el dueño del sistema.</p>

    <form id="formLogin">
      <label for="clave">Contraseña de administrador</label>
      <input type="password" id="clave" name="clave" required autofocus>

      <button type="submit">Entrar</button>
      <p id="error"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById('formLogin');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';

      const clave = document.getElementById('clave').value;

      const resp = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clave }),
      });

      const data = await resp.json();

      if (data.ok) {
        window.location.href = '/admin';
      } else {
        errorEl.textContent = data.mensaje;
        errorEl.style.display = 'block';
      }
    });
  </script>

</body>
</html>
